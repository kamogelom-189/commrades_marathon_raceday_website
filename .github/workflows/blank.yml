name: RaceDay API - CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust to match your .NET version (e.g., 7.0.x, 8.0.x)

    # 3. Restore Dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 4. Build Application
    - name: Build Project
      run: dotnet build --no-restore --configuration Release

    # 5. Run Unit Tests (if test project exists)
    - name: Run Tests
      run: dotnet test --no-build --verbosity normal --configuration Release

    # 6. Verify SQL Script Syntax / Files (Ensures /docs/schema.sql exists)
    - name: Validate Database Script Artifacts
      run: |
        if [ -f "./docs/schema.sql" ]; then
          echo "SQL Schema file found."
        else
          echo "Warning: /docs/schema.sql missing!"
        fi

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Artifacts
      run: dotnet publish -c Release -o ./publish

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-build
        path: ./publish
